name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install Dioxus CLI
        run: |
          curl -L https://github.com/cargo-bins/cargo-binstall/releases/latest/download/cargo-binstall-x86_64-unknown-linux-musl.tgz | tar -xvzf - -C ~/.cargo/bin
          # Use the same dioxus-cli version as the dioxus crate locked in Cargo.lock
          DX_VERSION=$(grep -A1 '^name = "dioxus"$' rs/Cargo.lock | sed -n 's/^version = "\(.*\)"/\1/p')
          echo "Installing dioxus-cli $DX_VERSION"
          cargo binstall "dioxus-cli@$DX_VERSION" -y

      - name: Build
        run: |
          cd rs
          # GitHub Pages is hosted at /<repo-name>/, so we set the base path in Dioxus.toml
          REPO_NAME=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          echo "Setting base path to: $REPO_NAME"
          sed -i "s/base_path = .*/base_path = \"$REPO_NAME\"/" Dioxus.toml
          
          dx build --release --platform web

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: rs/target/dx/ipa2tipa/release/web/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
